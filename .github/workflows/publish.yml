name: Publish

# One tag, one release: npm, GitHub Release, MCP Registry. Cut it with
#   npm version <x.y.z> && git push --follow-tags
# (scripts/version.mjs stamps server.json in the version commit; the first step checks it).
# Every publish step skips what is already published, so a partial release is finished by
# running the workflow again (Actions → Publish → Run workflow) on main for the released version.
#
# npm — OIDC Trusted Publishing, no npm token required.
#
# One-time setup on npmjs.com (per package):
#   Package → Publishing → Automated Publishing → Add trusted publisher
#     Repository : solutionsunity/odoo-surface-mcp
#     Workflow   : publish.yml
#     Environment: npm
#
# Critical constraints (all three must hold or publish will fail):
#   1. npm 11.5.1+ is required for OIDC support  →  "Upgrade npm" step replaces npm files directly
#   2. registry-url MUST be set in setup-node     →  writes .npmrc registry config; OIDC needs it
#   3. id-token: write permission must be present →  provides the OIDC token
#
# Hard-won lessons from debugging (do not revert these without understanding why):
#
#   ❌ npm install -g npm@latest
#      Fails on GitHub runners with MODULE_NOT_FOUND (promise-retry missing from the
#      bundled npm). The installed npm is broken and cannot upgrade itself.
#
#   ❌ corepack prepare npm@latest --activate
#      Prints "Preparing npm@latest for immediate activation..." but npm --version
#      still shows the old version. Corepack only intercepts `npm` calls when
#      `packageManager` is declared in package.json — without it, PATH is unchanged.
#
#   ❌ omitting registry-url from setup-node
#      Without registry-url, setup-node writes no .npmrc. npm has no registry config
#      anchor and will not attempt the OIDC token exchange → ENEEDAUTH.
#
#   ✅ tarball replacement (current approach)
#      Download the npm tarball via curl/python3 (no npm needed), extract to /tmp,
#      resolve the installed npm path via `node -e process.execPath`, replace in-place
#      with sudo cp. The PATH binary still points to the same wrapper script, but now
#      executes the new npm code. Confirmed by npm --version printing 11.x after the step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write  # GitHub Release
      id-token: write  # npm trusted publishing and MCP Registry OIDC

    steps:
      - uses: actions/checkout@v4

      - name: Tag, package.json and server.json agree
        run: |
          V=$(node -p "require('./package.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          echo "PKG=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"
          # On a tag push, the pushed tag itself must match; on a manual run, the release tag must exist.
          if [ "$GITHUB_EVENT_NAME" = push ]; then node scripts/version.mjs --check
          else GITHUB_REF_NAME="v$V" node scripts/version.mjs --check
               gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$V" --silent; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"  # writes .npmrc; OIDC requires this

      - name: Upgrade npm for OIDC support
        run: |
          # npm self-upgrade is broken on runners (missing bundled deps).
          # corepack does not update PATH without packageManager in package.json.
          # Solution: download fresh npm tarball and replace the installed npm files directly.
          NPM_VER=$(python3 -c "import urllib.request,json; print(json.loads(urllib.request.urlopen('https://registry.npmjs.org/npm/latest').read())['version'])")
          echo "Installing npm@${NPM_VER}"
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VER}.tgz" | tar xz -C /tmp
          NPM_LIB=$(node -e "console.log(require('path').join(process.execPath,'..','..','lib','node_modules','npm'))")
          sudo rm -rf "${NPM_LIB}"
          sudo cp -rf /tmp/package "${NPM_LIB}"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          if npm view "$PKG@$V" version >/dev/null 2>&1; then echo "npm: $PKG@$V already published"
          else npm publish --access public; fi

      - name: GitHub Release
        run: gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          V=1.8.1
          SHA=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          curl -fsSL -o mcp-publisher.tgz "https://github.com/modelcontextprotocol/registry/releases/download/v${V}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA}  mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          NAME=$(node -p "require('./server.json').name")
          if curl -fsS -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/${NAME//\//%2F}/versions/$V"; then
            echo "registry: $NAME $V already published"; exit 0
          fi
          # The registry validates the npm package; a fresh npm release takes minutes to be served.
          for i in $(seq 1 30); do npm view "$PKG@$V" version >/dev/null 2>&1 && break; sleep 20; done
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
